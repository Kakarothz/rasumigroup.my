<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14061f">
<title>Rasumi DO Scanner</title>
<style>
:root{--bg:#14061f;--card:#22103a;--line:#3a2257;--tx:#f4eefc;--mut:#a995c4;--ok:#33d17a;--warn:#f5c211;--bad:#ff5d6c;--pri:#b05cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header b{font-size:16px}
#cnt{margin-left:auto;font-weight:700;font-size:20px}
#cnt small{color:var(--mut);font-weight:500;font-size:13px}
#bar{height:5px;background:var(--line)}#barf{height:100%;width:0;background:var(--pri);transition:width .25s}
#cam{position:relative;background:#000;flex:0 0 38vh;max-height:340px;overflow:hidden}
#cam video{width:100%;height:100%;object-fit:cover}
#frame{position:absolute;inset:18% 8%;border:2px solid rgba(255,255,255,.75);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
#msg{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-weight:600;text-align:center;background:rgba(0,0,0,.65)}
#camerr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mut)}
.row{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
#man{flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font-size:16px}
button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px}
button.sec{background:var(--card);border:1px solid var(--line);color:var(--tx)}
#list{flex:1;overflow:auto;padding:4px 12px 16px}
.it{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.it .n{color:var(--mut);width:30px;text-align:right;font-variant-numeric:tabular-nums}
.it .d{font-weight:700;font-size:17px;letter-spacing:.5px}
.it .s{margin-left:auto;font-size:12px;border-radius:99px;padding:3px 9px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.it .s.verified{color:var(--ok);border-color:var(--ok)}.it .s.rejected{color:var(--bad);border-color:var(--bad)}
.it .r{flex-basis:100%;color:var(--bad);font-size:12px;margin-left:40px}
.it.w{flex-wrap:wrap}
#fatal{display:none;padding:30px 20px;text-align:center}
#fatal h2{margin:0 0 8px}
#ver{color:var(--mut);font-size:11px;text-align:center;padding:4px}
</style>
</head>
<body>
<header><b>Rasumi DO Scanner</b><div id="cnt">0<small> / 100</small></div></header>
<div id="bar"><div id="barf"></div></div>
<div id="fatal"><h2 id="fatalT">Pautan tidak sah</h2><div id="fatalM" style="color:var(--mut)"></div></div>
<div id="main" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div id="cam"><video id="v" playsinline muted autoplay></video><div id="frame"></div><div id="flash"></div><div id="camerr"></div><div id="msg">Mengaktifkan kamera…</div></div>
  <div class="row"><input id="man" inputmode="numeric" autocomplete="off" placeholder="Taip no. DO jika barcode tidak terbaca"><button id="add">Tambah</button></div>
  <div id="list"></div>
  <div id="ver">Sesi disimpan di pelayan. Jika skrin ditutup, buka pautan/QR yang sama untuk sambung.</div>
</div>

<script>
const SB="https://seqlkwdghibmsfkbuwqq.supabase.co/rest/v1/rpc/", KEY="sb_publishable_BotuzQAIly3eTShpQ_Lmtg_Y9_QlyDp";
const DO_RE=/(?<![A-Za-z0-9])([A-Za-z]{1,2}\d{6}|\d{8})(?![A-Za-z0-9])/;
const q=new URLSearchParams(location.search), SID=q.get('s')||'', TOK=(location.hash||'').replace(/^#/,'');
const $=id=>document.getElementById(id);
const DEV=/iPhone|iPad/.test(navigator.userAgent)?'iPhone':/Android/.test(navigator.userAgent)?'Android':'Peranti';
let S={count:0,target:100,items:[],state:'open'}, lastCode='', lastAt=0, busy=false, queue=[];
const QK='da_scan_q_'+SID;
try{queue=JSON.parse(localStorage.getItem(QK)||'[]')}catch(e){queue=[]}

async function rpc(fn,body){
  const r=await fetch(SB+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const t=await r.text(); let j; try{j=JSON.parse(t)}catch(e){j=null}
  if(!r.ok){const m=(j&&(j.message||j.hint))||('HTTP '+r.status);const e=new Error(m);e.http=r.status;throw e}
  return j;
}
function fatal(t,m){$('main').style.display='none';$('fatal').style.display='block';$('fatalT').textContent=t;$('fatalM').textContent=m||''}
let ac;function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function say(t,c){$('msg').textContent=t;$('msg').style.color=c||'#fff'}
function flash(c){const f=$('flash');f.style.background=c;f.style.opacity=.55;setTimeout(()=>f.style.opacity=0,180)}
function fb(kind,t){
  const m={ok:['#33d17a',880,60],dup:['#f5c211',440,120],bad:['#ff5d6c',200,260]}[kind];
  flash(m[0]);beep(m[1],m[2]/1000);if(navigator.vibrate)navigator.vibrate(kind==='ok'?40:[80,60,80]);say(t,m[0]);
}
function render(){
  const c=S.count||0,t=S.target||100;
  $('cnt').innerHTML=c+'<small> / '+t+'</small>';$('barf').style.width=Math.min(100,c/t*100)+'%';
  const L=$('list');L.innerHTML='';
  [...S.items].reverse().forEach((it,i)=>{
    const d=document.createElement('div');d.className='it'+(it.reason?' w':'');
    const lab={locked:'dikunci',verified:'sah',rejected:'ditolak'}[it.state]||it.state;
    d.innerHTML='<span class="n">'+(S.items.length-i)+'</span><span class="d"></span><span class="s '+it.state+'">'+lab+'</span>'+(it.reason?'<span class="r"></span>':'');
    d.querySelector('.d').textContent=it.do;if(it.reason)d.querySelector('.r').textContent=it.reason;L.appendChild(d);
  });
  if(S.state==='closed')say('Sesi telah ditutup oleh aplikasi','#f5c211');
}
async function refresh(){
  try{const j=await rpc('da_scan_state',{p_session:SID,p_token:TOK});S=j;render();return true}
  catch(e){if(/bad_session|expired/.test(e.message))fatal('Sesi tidak sah atau tamat','Minta QR baharu daripada Rasumi Apps (sesi lama disimpan 7 hari).');return false}
}
const MSG={added:['ok','Ditambah'],duplicate:['dup','Sudah discan'],invalid:['bad','Bukan no. DO'],full:['bad','Penuh – had dicapai'],locked_elsewhere:['bad','DO dikunci oleh sesi lain'],closed:['bad','Sesi ditutup']};
async function send(d){
  try{
    const j=await rpc('da_scan_add',{p_session:SID,p_token:TOK,p_do:d,p_device:DEV});
    const m=MSG[j.status]||['bad',j.status];fb(m[0],m[1]+' · '+d);
    queue=queue.filter(x=>x!==d);localStorage.setItem(QK,JSON.stringify(queue));
    await refresh();
  }catch(e){
    if(/bad_session|expired/.test(e.message)){fatal('Sesi tidak sah atau tamat','');return}
    if(!queue.includes(d)){queue.push(d);localStorage.setItem(QK,JSON.stringify(queue))}   // offline: retry later, nothing is lost
    fb('dup','Tiada rangkaian – '+d+' disimpan, akan dihantar semula');
  }
}
async function flushQueue(){for(const d of [...queue]){await send(d)}}
function onCode(text){
  const m=DO_RE.exec(String(text||''));const now=Date.now();
  if(!m){if(now-lastAt>1500){lastAt=now;fb('bad','Bukan no. DO: '+String(text).slice(0,18))}return}
  const d=m[1].toUpperCase();
  if(d===lastCode&&now-lastAt<2500)return;           // same barcode still in view
  lastCode=d;lastAt=now;send(d);
}
$('add').onclick=()=>{const m=DO_RE.exec($('man').value.trim());if(!m){fb('bad','No. DO tidak sah');return}$('man').value='';send(m[1].toUpperCase())};
$('man').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});

/* camera: native BarcodeDetector (Chrome/Android), ZXing fallback (iPhone Safari etc.) */
async function startCam(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    const v=$('v');v.srcObject=stream;await v.play();say('Halakan kamera ke barcode DO');
    try{const tr=stream.getVideoTracks()[0];const cap=tr.getCapabilities&&tr.getCapabilities();if(cap&&cap.focusMode&&cap.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    if('BarcodeDetector' in window){
      let fm=['code_128','code_39','ean_13','ean_8','itf','codabar','qr_code','upc_a','data_matrix'];
      try{const sup=await BarcodeDetector.getSupportedFormats();fm=fm.filter(f=>sup.includes(f))}catch(e){}
      const det=new BarcodeDetector({formats:fm});
      (async function loop(){try{if(v.readyState>=2){const r=await det.detect(v);if(r.length)onCode(r[0].rawValue)}}catch(e){}setTimeout(loop,120)})();
    }else{
      await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
      const Z=window.ZXing,hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);
      const rd=new Z.BrowserMultiFormatReader(hints,150);
      rd.decodeFromVideoElement(v,(r,err)=>{if(r)onCode(r.getText())});
    }
  }catch(e){
    const ce=$('camerr');ce.style.display='flex';
    ce.textContent=(e&&e.name==='NotAllowedError')?'Kamera disekat. Benarkan akses kamera untuk laman ini dalam tetapan pelayar, kemudian muat semula. Anda masih boleh menaip no. DO.':'Kamera tidak dapat dibuka ('+(e&&e.message||e)+'). Anda masih boleh menaip no. DO.';
    say('Tiada kamera – taip no. DO');
  }
}
(async()=>{
  if(!/^[0-9a-f-]{36}$/i.test(SID)||!TOK)return fatal('Pautan tidak sah','Imbas QR yang dipaparkan dalam Rasumi Apps (Doc Assembler).');
  if(!(await refresh()))return;
  if(S.state==='closed')return;
  flushQueue();startCam();
  try{if(navigator.wakeLock){let wl=await navigator.wakeLock.request('screen');document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'){try{wl=await navigator.wakeLock.request('screen')}catch(e){}refresh();flushQueue()}})}}catch(e){}
  setInterval(()=>{refresh();if(queue.length)flushQueue()},3000);
})();
</script>
</body>
</html>
