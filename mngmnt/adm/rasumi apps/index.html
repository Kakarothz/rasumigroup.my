  <script>
    // Clean URL bar (remove index.html) on load (skip on file:// to avoid SecurityError)
    if (window.location.protocol.startsWith('http') && window.location.pathname.endsWith('/index.html')) {
      var cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname.replace(/\/index\.html$/, '/');
      window.history.replaceState({}, document.title, cleanUrl + window.location.search + window.location.hash);
    }

    // ── DEBUG sementara — papar error ────────────────────────────
    window.onerror = function(msg, src, line, col, err) {
      document.body.style.background = '#0d1117';
      document.body.innerHTML = '<div style="font-family:monospace;color:#ef4444;padding:30px;font-size:13px">'
        + '<b>JS ERROR:</b><br>' + msg + '<br><br>'
        + '<b>File:</b> ' + src + '<br>'
        + '<b>Line:</b> ' + line + ' Col: ' + col + '<br><br>'
        + (err ? '<b>Stack:</b><br><pre style="color:#f87171;white-space:pre-wrap">' + err.stack + '</pre>' : '')
        + '</div>';
    };
    // ── Supabase Auth Guard ──────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      const _supa = supabase.createClient(
        'https://seqlkwdghibmsfkbuwqq.supabase.co',
        'sb_publishable_BotuzQAIly3eTShpQ_Lmtg_Y9_QlyDp'
      );

      // Check current session
      const { data: { session } } = await _supa.auth.getSession();
      if (!session) {
        window.location.href = '../index.html';
        return;
      }

      // DEBUG: semak enterRasumiMode
      if (typeof window.enterRasumiMode !== 'function') {
        document.body.style.background = '#0d1117';
        document.body.innerHTML = '<div style="font-family:monospace;color:#f59e0b;padding:30px;font-size:13px">'
          + '<b>WARN:</b> window.enterRasumiMode tidak wujud selepas app.js load.<br>'
          + 'Kemungkinan app.js ada runtime error semasa IIFE execute.</div>';
        return;
      }

      // Session valid — launch Rasumi Mode
      try {
        window.enterRasumiMode();
      } catch(e) {
        document.body.style.background = '#0d1117';
        document.body.innerHTML = '<div style="font-family:monospace;color:#ef4444;padding:30px;font-size:13px">'
          + '<b>enterRasumiMode() THREW:</b><br>'
          + '<pre style="color:#f87171;white-space:pre-wrap">' + e.stack + '</pre></div>';
      }

      // Redirect on sign-out
      _supa.auth.onAuthStateChange((event, session) => {
        if (!session) window.location.href = '../index.html';
      });
    });
  </script>

<body style="background: #05080f; margin: 0; overflow: hidden;" class="r-body-root">

  <!-- Rasumi JS will dynamically inject #rasumi-container inside the body -->
  <script src="app.js?v=1786675097017"></script>

  <!-- Mobile enhancements — desktop untouched (window.innerWidth guard) -->
  <script>
    (function () {
      if (window.innerWidth > 768) return;

      var nodesPanel, overlay;

      function closeNodes() {
        if (nodesPanel) nodesPanel.classList.remove('r-mob-open');
        if (overlay) overlay.style.display = 'none';
        var trigger = document.querySelector('.brand-icon');
        if (trigger) trigger.removeAttribute('data-nodes-open');
      }

      function openNodes() {
        nodesPanel.classList.add('r-mob-open');
        overlay.style.display = 'block';
        var trigger = document.querySelector('.brand-icon');
        if (trigger) trigger.setAttribute('data-nodes-open', '1');
      }

      function injectMobileUI() {
        var container = document.getElementById('rasumi-container');
        nodesPanel = container && container.querySelector('.r-nodes-panel');
        if (!container || !nodesPanel) return false;
        if (document.getElementById('r-mob-overlay')) return true; // already done

        /* ── 1. Overlay (full-screen backdrop, closes drawer on tap) ── */
        overlay = document.createElement('div');
        overlay.id = 'r-mob-overlay';
        container.appendChild(overlay);
        overlay.addEventListener('click', closeNodes);
        overlay.addEventListener('touchstart', closeNodes, { passive: true });

        /* ── 2. Brand icon at top-left = nodes drawer trigger ──────── */
        var brandIcon = document.querySelector('.brand-icon');
        if (brandIcon) {
          brandIcon.style.cursor = 'pointer';
          brandIcon.addEventListener('click', function (e) {
            e.stopPropagation();
            nodesPanel.classList.contains('r-mob-open') ? closeNodes() : openNodes();
          });
          brandIcon.addEventListener('touchstart', function (e) {
            e.stopPropagation();
          }, { passive: true });
        }

        /* ── 3. Patch rSelectNode — close drawer after tap ─────────── */
        var _origSelect = window.rSelectNode;
        window.rSelectNode = function (hostname) {
          if (_origSelect) _origSelect(hostname);
          closeNodes();
        };

        return true; // done
      }

      /* ── Wait for app.js to inject #rasumi-container ──────────── */
      if (!injectMobileUI()) {
        var _obs = new MutationObserver(function () {
          if (injectMobileUI()) _obs.disconnect();
        });
        _obs.observe(document.body, { childList: true, subtree: true });
      }
    })();
  </script>
</body>
</html>
