<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Rasumi Apps</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 0%,#2a0a4a,#0f0818 65%);color:#fff;font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:20px}
.c{width:100%;max-width:460px;background:rgba(20,10,30,.8);border:1px solid rgba(189,0,255,.45);border-radius:14px;padding:28px 28px 24px;text-align:center;box-shadow:0 0 30px rgba(189,0,255,.25)}
.c img{width:70%;max-width:260px;margin-bottom:14px}h1{font-size:20px;margin:0 0 8px;letter-spacing:.5px}p{color:#d7b8f0;margin:6px 0}
ol{text-align:left;background:rgba(120,20,160,.2);border-left:4px solid #d900ff;border-radius:6px;padding:12px 12px 12px 34px;margin:14px 0;color:#fff}li{margin:4px 0}
input{width:100%;height:42px;margin:6px 0;padding:0 12px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.4);color:#fff;font-size:16px}
button{margin-top:8px;width:100%;padding:12px;border-radius:99px;border:2px solid #bd00ff;background:linear-gradient(135deg,#8b008b,#4b0082);color:#fff;font-weight:700;letter-spacing:1px;cursor:pointer}
.m{min-height:22px;font-size:14px;margin-top:8px}.bad{color:#ff6b7a}.ok{color:#39ff14}</style></head><body><div class="c"><img src="../logo.webp" alt="Rasumi Medipharma"><h1>Set a new password</h1><div id="f"><input id="p1" type="password" placeholder="New password (min. 8 characters)" autocomplete="new-password"><input id="p2" type="password" placeholder="Confirm new password" autocomplete="new-password"><button id="go">Save password</button></div><div id="m" class="m"></div>
<script>
(function(){
var URL='https://seqlkwdghibmsfkbuwqq.supabase.co', KEY='sb_publishable_BotuzQAIly3eTShpQ_Lmtg_Y9_QlyDp';
var h=new URLSearchParams(location.hash.slice(1)), tok=h.get('access_token'), type=h.get('type');
var m=document.getElementById('m'), f=document.getElementById('f');
function say(t,c){m.textContent=t;m.className='m '+(c||'')}
if(!tok||type!=='recovery'){f.style.display='none';say('This reset link is invalid or has expired. Request a new one from the app (Forgot password?).','bad');}
history.replaceState(null,'',location.pathname);
document.getElementById('go').onclick=function(){
  var a=document.getElementById('p1').value,b=document.getElementById('p2').value;
  if(a.length<8){say('Password must be at least 8 characters.','bad');return}
  if(a!==b){say('The two passwords do not match.','bad');return}
  say('Saving...');
  fetch(URL+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+tok},body:JSON.stringify({password:a})})
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
   .then(function(x){if(x.ok){f.style.display='none';say('Password updated. Go back to Rasumi Apps and sign in.','ok')}else{say((x.j&&(x.j.msg||x.j.message))||'Could not update the password.','bad')}})
   .catch(function(){say('Connection error. Try again.','bad')});
};
})();
</script></div></body></html>
